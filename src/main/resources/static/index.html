<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Board</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
    <header class="hero">
        <p class="eyebrow">SPRING BOOT · JPA CRUD</p>
        <div class="hero-row">
            <div>
                <h1>Handwriting Board</h1>
                <p class="subtitle">직접 만든 게시글 API를 화면에서 확인해보세요.</p>
            </div>
            <span class="status"><span class="status-dot"></span> API 연결됨</span>
        </div>
    </header>

    <section class="grid">
        <article class="panel write-panel">
            <div class="panel-heading">
                <p class="panel-label">CREATE</p>
                <h2>새 게시글</h2>
            </div>

            <form id="post-form">
                <label for="title">제목</label>
                <input id="title" name="title" type="text" placeholder="제목을 입력하세요" required maxlength="100">

                <label for="author">작성자</label>
                <input id="author" name="author" type="text" placeholder="작성자 이름" required maxlength="30">

                <label for="content">내용</label>
                <textarea id="content" name="content" placeholder="내용을 입력하세요" required maxlength="2000"></textarea>

                <button id="submit-button" type="submit">게시글 등록</button>
                <p id="form-message" class="message" aria-live="polite"></p>
            </form>
        </article>

        <article class="panel list-panel">
            <div class="panel-heading panel-heading-row">
                <div>
                    <p class="panel-label">READ</p>
                    <h2>게시글 목록</h2>
                </div>
                <button id="refresh-button" class="secondary-button" type="button">새로고침</button>
            </div>

            <div id="post-list" class="post-list" aria-live="polite"></div>
        </article>
    </section>

    <section class="panel detail-panel">
        <div class="panel-heading">
            <p class="panel-label">DETAIL</p>
            <h2>게시글 상세</h2>
        </div>
        <div id="post-detail" class="empty-detail">목록에서 게시글을 선택하세요.</div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
